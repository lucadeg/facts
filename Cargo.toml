[package]
name = "facts"
version = "0.7.1"
edition = "2024"
description = "A CLI for fact-driven development with coding agents"
license = "MIT"
repository = "https://github.com/av/facts"
authors = ["av <av@av.codes>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2"
predicates = "3"
