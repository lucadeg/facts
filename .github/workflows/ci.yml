name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Checkout wiki
        run: git clone --depth 1 https://github.com/av/facts.wiki.git "${GITHUB_WORKSPACE}/../facts.wiki"

      - name: Install facts CLI
        run: cargo install --path . --root ~/.local --locked

      - name: Validate own facts
        run: facts check --no-agent
